name: risk-based-code-review

services:
  # tier-review runs in the example codebase's test environment: cataloging runs its
  # suite, so it needs its dependencies (and git, to snapshot the base). The repo is
  # mounted at /repo, so paths such as .tier-review/head land in the working tree.
  # Run it as the host user (HOST_UID/HOST_GID) so the catalogs it writes stay yours.
  tier-review:
    build:
      context: .
      dockerfile: example-codebase/Dockerfile.test
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /repo
    environment:
      TIER_REVIEW_PROJECT: example-codebase
    volumes:
      - .:/repo
    entrypoint: ["tier-review"]
