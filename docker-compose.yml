name: monolith-review

services:
  # The example codebase (a helpdesk system), served.
  helpdesk:
    build: ./example-codebase
    ports: ["${HELPDESK_PORT:-8000}:8000"]

  # Catalog tiers: runs the example codebase suite (application and test code measured)
  # and records
  #   /data/$CATALOG/.coverage        line -> tests (coverage contexts)
  #   /data/$CATALOG/test-tiers.json  test -> tier (@pytest.mark.tier)
  # CATALOG=head catalogs the working tree; CATALOG=base with CATALOG_SRC a base snapshot.
  catalog-tiers:
    build:
      context: .
      dockerfile: example-codebase/Dockerfile.test
    working_dir: /work/example-codebase
    environment:
      COVERAGE_FILE: /data/${CATALOG:-head}/.coverage
    volumes:
      - ${CATALOG_SRC:-./example-codebase}:/work/example-codebase:ro
      - tier-data:/data
    command: >
      sh -c "mkdir -p /data/${CATALOG:-head} && pytest -q --cov --cov-context=test --cov-report=
      --test-tiers=/data/${CATALOG:-head}/test-tiers.json --tier-strict"

  # Classifies the working-tree diff against BASE, using both catalogs.
  tier-review:
    build:
      context: ./tier-review
      target: runtime
    volumes:
      - .:/repo:ro
      - tier-data:/data:ro
    command: >
      classify --repo /repo --project example-codebase --base ${BASE:-HEAD}
      --line-tests /data/head/.coverage --test-tiers /data/head/test-tiers.json
      --base-line-tests /data/base/.coverage --base-test-tiers /data/base/test-tiers.json

volumes:
  tier-data:
