name: monolith-review

services:
  # The example codebase (a helpdesk system), served.
  helpdesk:
    build: ./example-codebase
    ports: ["${HELPDESK_PORT:-8000}:8000"]

  # Runs the example codebase suite (application and test code measured) and records
  #   /data/$MAP/.coverage        which test executed which line (coverage contexts)
  #   /data/$MAP/test-tiers.json  which tier each test protects (@pytest.mark.tier)
  # MAP=head maps the working tree; MAP=base with MAP_SRC maps a snapshot of the base.
  coverage-map:
    build:
      context: .
      dockerfile: example-codebase/Dockerfile.test
    working_dir: /work/example-codebase
    environment:
      COVERAGE_FILE: /data/${MAP:-head}/.coverage
    volumes:
      - ${MAP_SRC:-./example-codebase}:/work/example-codebase:ro
      - tier-data:/data
    command: >
      sh -c "mkdir -p /data/${MAP:-head} && pytest -q --cov --cov-context=test --cov-report=
      --tier-catalog=/data/${MAP:-head}/test-tiers.json --tier-strict"

  # Decides the review tier of the working-tree diff against BASE, using both maps.
  tier-review:
    build:
      context: ./tier-review
      target: runtime
    volumes:
      - .:/repo:ro
      - tier-data:/data:ro
    command: >
      classify --repo /repo --project example-codebase --base ${BASE:-HEAD}
      --coverage /data/head/.coverage --catalog /data/head/test-tiers.json
      --base-coverage /data/base/.coverage --base-catalog /data/base/test-tiers.json

volumes:
  tier-data:
